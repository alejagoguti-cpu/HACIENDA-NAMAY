<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hacienda Namay · Masterplan 3D, Axonometría Explotada & Recorrido Peatonal</title>
    <meta name="title" content="Hacienda Namay · Masterplan 3D, Axonometría Explotada & Recorrido Peatonal" />
    <meta name="description" content="Gemelo digital y masterplan 3D interactivo de Hacienda Namay en Albán, Cundinamarca: árboles tipo Unreal con viento, despiece axonométrico, recorrido habitación por habitación con flechas del teclado, apertura de puertas y control de iluminación PBR." />
    <meta name="theme-color" content="#1e1f12" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="./src/styles/namay3d.css" />

    <!-- Import Map para Three.js ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  </head>
  <body>
    <!-- Contenedor del lienzo WebGL Three.js -->
    <div id="canvas-container"></div>

    <!-- Barra de navegación superior y comandos -->
    <div id="controls-hud-container"></div>

    <!-- Panel lateral izquierdo de navegación habitación por habitación -->
    <div id="sidebar-container" class="sidebar-container"></div>

    <!-- Tarjeta flotante de ficha técnica del recinto seleccionado -->
    <div id="detail-card-container" class="detail-card-container"></div>

    <!-- Script principal de la aplicación -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
